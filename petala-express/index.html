<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pétala Express — Cosméticos com entrega rápida</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <span class="logo">Pétala</span>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar produtos ou marcas" aria-label="Buscar produtos"></label>
    <button class="ico" id="cartBtn" aria-label="Abrir carrinho"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1.2 11H6.2L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="badge" id="badge" hidden>0</span></button>
  </div>
  <div class="loc">
    <small><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.800 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="addr">São Manuel, SP</span></small>
    <button class="store-btn" id="storeBtn" aria-haspopup="dialog"><span style="flex:1;min-width:0"><span>Comprando em:</span><b id="storeLbl"></b></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Beleza que chega antes de acabar o creme.</h1>
    <p>Escolha a loja mais perto de você e receba em minutos ou retire sem fila.</p>
  </section>
  <nav class="cats" id="cats" aria-label="Categorias"></nav>
  <div class="sec-h"><h2 id="gt">Para você</h2><span id="gc"></span></div>
  <div class="grid" id="grid"></div>
  <div id="sentinel" class="end"></div>
</main>

<div class="ov" id="ov"></div>

<aside class="drawer left" id="storeD" role="dialog" aria-label="Escolher loja">
  <div class="dh"><h2>Lojas perto de você</h2><button class="ico" data-close aria-label="Fechar">✕</button></div>
  <div class="db">
    <button class="btn ghost geo" id="geoBtn">Usar minha localização</button>
    <p class="note" id="geoNote">Ordenadas da mais próxima para a mais distante de <b id="geoWhere">São Manuel, SP</b>.</p>
    <div id="storeList"></div>
  </div>
</aside>

<div class="modal" id="pm" role="dialog" aria-label="Detalhes do produto"></div>

<aside class="drawer" id="cartD" role="dialog" aria-label="Carrinho">
  <div class="dh"><h2>Seu pedido</h2><button class="ico" data-close aria-label="Fechar">✕</button></div>
  <div class="db" id="cartB"></div>
  <div class="df" id="cartF"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
